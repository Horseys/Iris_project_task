services:
  postgis:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: task_cre_50
      POSTGRES_USER: task_cre_50
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - task_cre_50_postgres:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_cre_50 -d task_cre_50"]
      interval: 5s
      timeout: 5s
      retries: 12

  task-cre-50:
    profiles: ["etl"]
    build:
      context: .
    environment:
      DB_URI: postgresql+psycopg://task_cre_50:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgis:5432/task_cre_50
    depends_on:
      postgis:
        condition: service_healthy

volumes:
  task_cre_50_postgres:
